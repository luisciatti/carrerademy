services:
  postgres:
    image: postgres:16-alpine
    container_name: career-path-ai-postgres
    environment:
      POSTGRES_DB: career_path_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_path_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: career-path-ai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-path-ai-backend
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/career_path_ai
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-path-ai-worker
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/career_path_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A app.infra.queue.celery_app worker --loglevel=info

  frontend:
    profiles: ["full"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: career-path-ai-frontend
    env_file:
      - ../frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  postgres_data: