[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-path-ai-backend"
version = "0.1.0"
description = "Backend setup for Career Path AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.4",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "celery[redis]>=5.5.3",
    "httpx>=0.28.1",
    "PyJWT[crypto]>=2.10.1",
    "svix>=1.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
]

[tool.setuptools]
packages = ["app"]